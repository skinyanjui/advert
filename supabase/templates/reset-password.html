<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your password</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Geist,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#171717;">
  <!-- Admin: paste after custom SMTP is enabled. Until then, default ConfirmationURL reset links only work in the browser that requested them. -->
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f5;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:520px;background:#ffffff;border-radius:12px;border:1px solid #e5e5e5;overflow:hidden;">
          <tr>
            <td style="padding:28px 28px 8px;">
              <p style="margin:0;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:#737373;">africa classifieds</p>
              <h1 style="margin:12px 0 0;font-size:22px;line-height:1.3;font-weight:600;">Reset your password</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 24px;font-size:15px;line-height:1.55;color:#404040;">
              <p style="margin:0 0 16px;">We received a request to reset the password for <strong>{{ .Email }}</strong>.</p>
              <p style="margin:0 0 20px;">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/auth/reset" style="display:inline-block;background:#0a0a0a;color:#ffffff;text-decoration:none;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:500;">Choose a new password</a>
              </p>
              <p style="margin:0;font-size:13px;color:#737373;">If you did not ask to reset your password, you can ignore this email. You can still sign in with an email link.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
